<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3f0" />
    <meta name="description" content="RideScope is an interactive cycling analytics dashboard powered by PostgreSQL ride data." />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("ridescope-theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch {
          // Keep the default light theme when browser storage is unavailable.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>RideScope · Personal Cycling Intelligence</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>RideScope needs JavaScript enabled to calculate your cycling analytics.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
